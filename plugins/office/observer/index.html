<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina dev-office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: la oficina en pixel art a todo el ancho; debajo, una franja de números clave y tres columnas: empleado, equipo y actividad. */
:root {
  --night: #12151d;      /* fondo: noche de oficina */
  --panel: #1b202b;      /* tarjetas */
  --panel-2: #232a38;    /* filas y controles */
  --line: #313b52;       /* bordes */
  --ink: #ebe5d8;        /* texto: papel cálido */
  --ink-dim: #98a1b3;    /* texto secundario */
  --accent: #f2c14e;     /* luz de escritorio */
  --ok: #5cc98a;
  --bad: #ef6b5b;
  --claude: #e07a52;
  --codex: #d6dbe3;
  --gemini: #6f9cff;
  --font-pixel: "Silkscreen", "Courier New", monospace;
  --font-data: "Space Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-data);
  font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.page { display: grid; gap: 14px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
header.top h1 { font-family: var(--font-pixel); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; margin: 0; }
.sim-chip { font-family: var(--font-pixel); font-size: 10px; letter-spacing: 0.08em; padding: 4px 8px; border: 1px dashed var(--accent); color: var(--accent); }
.sim-chip.live { border-style: solid; border-color: var(--ok); color: var(--ok); }
.sim-chip.live::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--ok); margin-right: 6px; animation: pulse 1.2s steps(2) infinite; }
@keyframes pulse { 50% { opacity: 0.2; } }
@media (prefers-reduced-motion: reduce) { .sim-chip.live::before { animation: none; } }
.notice { margin: 0; background: var(--panel); border: 1px dashed var(--line); padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--ink-dim); }
.notice code { color: var(--ink); background: var(--panel-2); padding: 1px 5px; }
.mode { display: flex; gap: 6px; }
.ticket { color: var(--ink-dim); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
.ticket b { color: var(--ink); }
.controls { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
button {
  font-family: var(--font-pixel); font-size: 11px; letter-spacing: 0.05em;
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  padding: 7px 10px; cursor: pointer; box-shadow: 0 2px 0 #090b10;
}
button:hover { border-color: var(--accent); }
button:active { transform: translateY(2px); box-shadow: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: #1a1406; border-color: var(--accent); }

.phases { display: flex; gap: 4px; flex-wrap: wrap; }
.phase { font-family: var(--font-pixel); font-size: 10px; letter-spacing: 0.06em; padding: 5px 8px; background: var(--panel); color: var(--ink-dim); border: 1px solid var(--line); }
.phase.done { color: var(--ok); border-color: #2e5a43; }
.phase.now { color: #1a1406; background: var(--accent); border-color: var(--accent); }

.stage { position: relative; background: #0b0e14; border: 2px solid var(--line); }
.stage canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: pointer; }
.hint { position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: var(--ink-dim); background: rgba(11,14,20,0.85); padding: 3px 7px; pointer-events: none; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; min-width: 0; }
.stat .k { font-family: var(--font-pixel); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); text-transform: uppercase; }
.stat .v { font-family: var(--font-pixel); font-size: 20px; margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .s { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
.stat .bar { height: 6px; background: var(--panel-2); margin-top: 8px; position: relative; }
.stat .bar i { position: absolute; inset: 0 auto 0 0; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.2fr); gap: 10px; align-items: start; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); padding: 12px; min-width: 0; }
.card h2 { font-family: var(--font-pixel); font-weight: 400; font-size: 11px; letter-spacing: 0.1em; color: var(--ink-dim); margin: 0 0 10px; text-transform: uppercase; }

.agents { display: grid; gap: 4px; max-height: 360px; overflow-y: auto; }
.agent {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  background: var(--panel-2); padding: 6px 8px; border: 1px solid transparent; cursor: pointer; text-align: left;
  font-family: var(--font-data); font-size: 12px; box-shadow: none; width: 100%;
}
.agent.sel { border-color: var(--accent); }
.agent .dot { width: 10px; height: 10px; }
.agent .who { min-width: 0; }
.agent .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .who span { display: block; color: var(--ink-dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-family: var(--font-pixel); font-size: 9px; letter-spacing: 0.06em; padding: 3px 6px; white-space: nowrap; border: 1px solid currentColor; }
.pill.working { color: var(--accent); }
.pill.waiting { color: var(--accent); background: rgba(242,193,78,0.12); }
.pill.pass { color: var(--ok); }
.pill.fail { color: var(--bad); }
.pill.idle { color: var(--ink-dim); }

.detail .name { font-family: var(--font-pixel); font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.detail .head { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: start; margin-bottom: 10px; }
.detail canvas { width: 112px; height: 112px; image-rendering: pixelated; background: var(--panel-2); border: 1px solid var(--line); display: block; }
.detail .head .name { margin: 0 0 6px; }
.detail .quote { font-size: 12px; color: var(--ink-dim); line-height: 1.45; }
.detail dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 5px 10px; margin: 0; font-size: 12px; }
.detail dt { color: var(--ink-dim); }
.detail dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; max-height: 360px; overflow-y: auto; font-size: 12px; }
.feed li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; line-height: 1.45; }
.feed time { color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.feed .alert { color: var(--bad); }
.feed .good { color: var(--ok); }
.feed .warn { color: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--ink-dim); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; display: inline-block; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Oficina dev-office</h1>
    <span class="sim-chip" id="mode-chip">DEMO</span>
    <span class="ticket" id="ticket">Sin sesión todavía</span>
    <div class="controls">
      <div class="mode" role="group" aria-label="Qué mostrar">
        <button id="btn-live" type="button" aria-pressed="false">En vivo</button>
        <button id="btn-demo" type="button" aria-pressed="true">Demo</button>
      </div>
      <div class="mode" id="demo-controls" role="group" aria-label="Controles de la demo">
      <button id="btn-play" type="button" aria-pressed="false">Pausa</button>
      <button type="button" aria-pressed="false" data-speed="1">1x</button>
      <button type="button" aria-pressed="true" data-speed="2">2x</button>
      <button type="button" aria-pressed="false" data-speed="4">4x</button>
      <button id="btn-restart" type="button">Reiniciar</button>
      </div>
    </div>
  </header>

  <p class="notice" id="notice" hidden>Todavía no hay actividad de la oficina en este proyecto. Abrí una sesión con <code>claude --agent office:pm</code> y esta página se actualiza sola. Mientras tanto, mirá la demo.</p>

  <nav class="phases" id="phases" aria-label="Recorrido de la oficina"></nav>

  <div class="stage">
    <canvas id="office" width="1536" height="896" aria-label="Oficina en pixel art: el PM camina entre las oficinas, cada departamento trabaja en su escritorio y la gente se levanta a hablar con su líder"></canvas>
    <div class="hint">Tocá un empleado para ver qué está haciendo</div>
  </div>

  <section class="stats" id="stats" aria-label="Resumen"></section>

  <div class="cols">
    <section class="card detail" id="detail" aria-live="polite"></section>
    <section class="card">
      <h2>Equipo</h2>
      <div class="agents" id="agents"></div>
      <div class="legend">
        <span><i style="background:var(--claude)"></i>Claude</span>
        <span><i style="background:var(--codex)"></i>Codex</span>
        <span><i style="background:var(--gemini)"></i>Gemini</span>
      </div>
    </section>
    <section class="card">
      <h2>Actividad</h2>
      <ol class="feed" id="feed"></ol>
    </section>
  </div>
</div>

      // Si el otro todavía está caminando, lo espera (hasta 20 segundos).
      if (b && b.acts.length && b.acts[0].k === "go" && (act.waited += dt) < 20) return false;

      act.i += 1;

      if (a.pose && state.t > a.pose.until) a.pose = null;
      let guard = 0;
      while (a.acts.length && guard++ < 6) {

    if (reduced || state.t < state.nextIdle) return;
    state.nextIdle = state.t + 5 + Math.random() * 6;
    const free = state.agents.filter(a => a.present && a.provider && a.room !== "meet" && a.status === "idle" && !a.pos && !a.acts.length && !a.pose);
    if (!free.length || state.agents.filter(a => a.idleTrip).length >= 3) return;
    // Nadie se va mientras otro viene a hablarle.
    const visited = new Set(state.agents.flatMap(x => x.acts.map(k => k.with || (k.to && k.to.visit)).filter(Boolean)));
    const avail = free.filter(b => !visited.has(b.id));
    if (!avail.length) return;
    const a = avail[Math.floor(Math.random() * avail.length)], r = Math.random();
    const others = avail.filter(b => b !== a);
    const same = others.filter(b => b.room === a.room), far = others.filter(b => b.room !== a.room);
    const goFar = far.length > 0 && (!same.length || Math.random() < 0.55);
    const mates = goFar ? far : same;
    if (r < 0.35) {
      a.idleTrip = true;
      a.acts.push({ k: "go", to: { coffee: true } }, { k: "prop", prop: "cup" }, { k: "say", text: COFFEE_LINES[Math.floor(Math.random() * COFFEE_LINES.length)], d: 2.2 }, { k: "home" }, { k: "prop", prop: null });
    } else if (r < 0.8 && mates.length) {

  // Alguien de pie: camina con cuatro cuadros, gesticula cuando habla y puede llevar algo.

  // Texto nítido sobre el canvas escalado.
  function text(t, x, y, o = {}) {
    const size = (o.size || 7) * S;
    ctx.font = (o.bold ? "700 " : "400 ") + size + "px " + (o.font || "Silkscreen, monospace");
    ctx.textAlign = o.align || "left";
    ctx.textBaseline = "top";
    const w = ctx.measureText(t).width;
    const pad = 3 * S;
    const bx = o.align === "center" ? x * S - w / 2 - pad : x * S - pad;
    const by = y * S - pad * 0.7;
    if (o.bg) {
      ctx.fillStyle = o.bg;
      ctx.fillRect(Math.round(bx), Math.round(by), Math.round(w + pad * 2), Math.round(size + pad * 1.4));
      if (o.border) { ctx.strokeStyle = o.border; ctx.lineWidth = S; ctx.strokeRect(Math.round(bx) + S / 2, Math.round(by) + S / 2, Math.round(w + pad * 2) - S, Math.round(size + pad * 1.4) - S); }
      if (o.tail) { ctx.fillStyle = o.border || o.bg; ctx.fillRect(Math.round(x * S - 2 * S), Math.round(by + size + pad * 1.4), 4 * S, 3 * S); }
    }
    ctx.fillStyle = o.color || "#ebe5d8";
    ctx.fillText(t, x * S, y * S);
  }

  // --- En vivo: los eventos de .office/observer/events.js ------------------------
  // La página se abre desde el disco, sin servidor: el archivo de eventos es JavaScript
  // ("OFFICE_EVENT({...});" por línea) y se vuelve a cargar cada 1,5 segundos.
  let mode = "demo", userPicked = false, liveEvents = [], liveCount = -1, liveFile = false, liveAnimFrom = -1;
  const ROLE_SEAT = {
    "backend.architect": "barch", "frontend.architect": "farch", "frontend.designer": "dsgn", "devops.architect": "oarch",
    "backend.developer": "bdev", "backend.tester": "btest", "frontend.developer": "fdev", "frontend.tester": "ftest",
    "database.developer": "ddev", "database.tester": "dtest", "scraper.developer": "sdev", "scraper.tester": "stest",
    "devops.developer": "odev", "devops.tester": "otest",
    "backend.lead": "blead", "frontend.lead": "flead", "database.lead": "dlead", "scraper.lead": "slead", "devops.lead": "olead",
  };
  const ROOM_DEPT = { back: "backend", front: "frontend", db: "database", scrap: "scraper", ops: "devops" };
  const DEPTS = ["backend", "frontend", "database", "scraper", "devops"];
  const FAILS = ["FALLA", "RECHAZADO", "PROVEEDOR NO DISPONIBLE", "REGLAS ROTAS", "TIEMPO AGOTADO", "FALLO"];
  const roleFromType = t => {
    if (t === "office:qa") return "qa";
    // Claude Code identifica al líder como "<área>-lead" (en agent_type y from_type), no como "dept-<área>:lead".
    const lead = /^([a-z]+)-lead$/.exec(t || "");
    if (lead) return DEPTS.includes(lead[1]) ? lead[1] + ".lead" : null;
    const m = /^dept-([a-z]+):([a-z-]+)$/.exec(t || "");
    return m ? m[1] + "." + m[2] : null;
  };
  const stripRole = d => String(d || "").replace(/^\[[^\]]*\]\s*/, "");
  const hourOf = t => { if (!t) return "—"; const d = new Date(t * 1000); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  function toolLabel(tool, target) {
    const t = String(target || "");
    const cut = v => (v.length > 34 ? v.slice(0, 33) + "…" : v);
    if (/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(tool)) return "edita " + cut(t);
    if (tool === "Read") return "lee " + cut(t);
    if (tool === "Grep" || tool === "Glob") return "busca " + cut(t);
    if (tool === "Bash") return /run-external\.sh/.test(t) ? "corre el proveedor" : "$ " + cut(t);
    if (tool === "Skill") return "skill " + cut(t.replace(/^office:/, ""));
    if (tool === "WebFetch" || tool === "WebSearch") return "busca en la web";
    return cut(tool + (t ? " " + t : ""));
  }

  function liveReset(sess) {
    const cfg = (sess && sess.config) || {};
    const depts = sess && Array.isArray(sess.departments) ? sess.departments : null;
    ROOMS.forEach(r => { const d = ROOM_DEPT[r.id]; r.off = !!(depts && d && !depts.includes(d)); });
    state.agents.forEach(a => {
      const base = AGENTS.find(b => b.id === a.id);
      Object.assign(a, { status: "idle", tool: "", task: "", tokens: 0, ext: 0, startedAt: null, bubble: null, bubbleUntil: 0, toolList: null });
      let entry = null;
      if (a.id === "qa1" || a.id === "qa2") entry = (cfg.qa || ["claude"])[a.id === "qa1" ? 0 : 1] || null;
      else if (a.id === "adv") entry = (cfg.pm || [])[0] || null;
      else if (/\.lead$/.test(a.role || "")) entry = sess && sess.teams ? "claude" : null; // líderes: solo en el modo equipos
      else if (a.id !== "ceo") entry = (cfg[a.role] || ["claude"])[0];
      const dept = (a.role || "").split(".")[0];
      const deptOff = !!(depts && DEPTS.includes(dept) && !depts.includes(dept));
      a.present = a.id === "ceo" || (!!entry && !deptOff);
      if (entry) {
        const [p, m] = String(entry).split(":");
        a.provider = PROVIDERS[p] ? p : "claude";
        a.model = m || (a.provider === "claude" ? base.tier : "nivel " + base.tier);
      }
      if (a.id === "qa1" || a.id === "qa2") a.label = "QA (" + PROVIDERS[a.provider].name + ")";
    });
  }

  function seatFor(role, provider) {
    if (role === "qa") {
      const qs = ["qa1", "qa2"].map(agent).filter(a => a.present);
      const q = qs.find(a => a.provider === provider) || qs[0];
      return q ? q.id : null;
    }
    if (role === "pm") return agent("adv").present ? "adv" : null;
    const id = ROLE_SEAT[role];
    return id && agent(id).present ? id : null;
  }

  function setPMTarget(target) {
    if (state.pmTarget === target) return;
    state.pmTarget = target;
    const to = target === "door" ? DOOR_SPOT() : target === "ceo" || !agent(target) ? MEET_SPOT() : standSpot(target);
    state.pm.path = planPath(state.pm, to);
    state.pm.dest = to;
  }

  // Reconstruye la oficina con todos los eventos de la sesión. Las animaciones (levantarse,
  // caminar, charlar) salen solo de los eventos nuevos y recientes, no de la historia.
  function liveRebuild() {
    const evs = liveEvents;
    if (liveAnimFrom < 0) liveAnimFrom = evs.length;      // al abrir la página: nada de la historia
    else if (liveAnimFrom > evs.length) liveAnimFrom = 0; // el archivo empezó de nuevo
    const animFrom = liveAnimFrom, nowS = Date.now() / 1000;
    liveAnimFrom = evs.length;
    let si = -1;
    for (let i = evs.length - 1; i >= 0; i--) if (evs[i].type === "session") { si = i; break; }
    const sess = si >= 0 ? evs[si] : null;
    const base = si >= 0 ? si : 0;
    const list = evs.slice(base);
    const t0 = sess ? sess.t : (list[0] ? list[0].t : nowS);
    const sessKey = sess ? sess.t + ":" + base : "none";
    if (state.liveSession !== sessKey) { state.liveSession = sessKey; state.agents.forEach(clearAnim); state.holds = {}; state.nextIdle = 0; }
    liveReset(sess);
    const teams = !!(sess && sess.teams);
    const L = state.live = { t0, sess, teams, pmTokens: 0, claudeSub: 0, ext: { codex: 0, gemini: 0 }, route: [], fails: 0, leads: {} };
    state.feed = [];
    const pending = [], byAgent = {}, fx = [];
    let pmTarget = "door", pmStatus = "idle", pmTool = "", pmTask = "";
    const tok = u => (u ? (u.i || 0) + (u.o || 0) + (u.cw || 0) : 0);
    const feed = (e, text, kind) => state.feed.unshift({ at: e.t, t: e.t - t0, text, kind: kind || "" });
    const leadSeat = dept => seatFor(dept + ".lead");
    const leadByName = name => { const m = /^([a-z]+)-lead\b/.exec(name || ""); return m ? leadSeat(m[1]) : null; };
    const isLeadRole = r => /\.lead$/.test(r || "");
    // El líder que coordina a un developer o tester, si su departamento trabaja en modo equipos.
    const managedBy = r => { const d = (r || "").split(".")[0]; return teams && /\.(developer|tester)$/.test(r || "") && L.leads[d] ? leadSeat(d) : null; };
    const goTo = seat => { pmTarget = seat; const rn = room(agent(seat).room).name; if (L.route[L.route.length - 1] !== rn) L.route.push(rn); };
    // De quién es un evento: por su agent_id o, si no se conoce, por su tipo de agente (líder).
    const seatOfEvent = (id, type) => {
      if (id && byAgent[id] && byAgent[id].seat) return byAgent[id].seat;
      if (isLeadRole(roleFromType(type))) { const seat = seatFor(roleFromType(type)); if (id && seat) byAgent[id] = { seat, role: roleFromType(type) }; return seat; }
      return null;
    };

    list.forEach((e, k) => {
      const fresh = base + k >= animFrom && nowS - e.t < 30;
      if (e.type === "session") { feed(e, e.source === "resume" ? "Se retoma la sesión de la oficina." : "Empieza la sesión de la oficina."); }
      else if (e.type === "prompt") { pmTarget = "ceo"; pmStatus = "working"; pmTool = "conversa con el CEO"; pmTask = "Reunión con el CEO"; feed(e, "El CEO llama al PM."); }
      else if (e.type === "delegate") {
        const role = e.role || roleFromType(e.subagent_type);
        const provider = String(e.provider || "claude").toLowerCase();
        const seat = role ? seatFor(role, provider) : null;
        const dept = (role || "").split(".")[0];
        const what = stripRole(e.description) || "sin descripción";
        // En el modo equipos, el developer y el tester los encarga su líder, no el PM.
        // En el modo equipos, el developer y el tester los encarga su líder, nunca el PM. El PM es la
        // sesión principal y sus eventos no traen agent_id: si el encargo trae uno, es de un compañero
        // de equipo (el líder). Y si el líder del departamento ya está trabajando, también es suyo.
        const fromLead = /\.(developer|tester)$/.test(role || "") && leadSeat(dept) &&
          (isLeadRole(roleFromType(e.from_type)) || (e.from && byAgent[e.from] && isLeadRole(byAgent[e.from].role)) ||
           (teams && !!e.from && !(byAgent[e.from] && byAgent[e.from].seat)) || L.leads[dept]);
        const lead = fromLead ? leadSeat(dept) : null;
        // Un compañero de equipo que no conocíamos: desde ahora sus herramientas y mensajes son del líder.
        if (lead && e.from && !byAgent[e.from]) byAgent[e.from] = { seat: lead, role: dept + ".lead" };
        pending.push({ type: e.subagent_type, seat, role, provider, model: e.xmodel || null, desc: e.description || "", lead });
        if (lead) {
          const la = agent(lead);
          Object.assign(la, { status: "working", tool: "coordina: " + what });
          feed(e, la.label + " encarga a " + (seat ? agent(seat).label : role || e.subagent_type) + ": " + what + ".");
          if (fresh && seat) fx.push(() => talkTo(lead, seat, [shortText("Te paso: " + what, 30), "Dale, arranco"]));
          return;
        }
        if (seat) goTo(seat);
        pmStatus = "working";
        pmTool = "encarga: " + (stripRole(e.description) || role || e.subagent_type);
        if (isLeadRole(role) && seat) {
          L.leads[dept] = true;
          Object.assign(agent(seat), { status: "working", task: what, tool: "lee el encargo", startedAt: e.t - t0, bubble: null });
          if (fresh) fx.push(() => agent(seat).acts.push({ k: "wait", d: 2.5 }, { k: "say", text: "Entendido, lo reparto", d: 2.2 }));
        }
        const who = seat ? agent(seat).label : (role || e.subagent_type);
        feed(e, "PM encarga a " + who + (PROVIDERS[provider] && provider !== "claude" ? " (" + PROVIDERS[provider].name + ")" : "") + ": " + what + ".");
        if (fresh && role === "qa" && /valid/i.test(String(e.mode || "") + " " + String(e.description || ""))) fx.push(qaDebate);
      }
      else if (e.type === "start") {
        const role = roleFromType(e.agent_type);
        const i = pending.findIndex(p => p.type === e.agent_type || (isLeadRole(role) && p.role === role));
        const p = i >= 0 ? pending.splice(i, 1)[0] : { type: e.agent_type, seat: role ? seatFor(role, "claude") : null, role, provider: "claude", desc: "" };
        byAgent[e.agent] = p;
        if (p.seat) {
          const a = agent(p.seat);
          Object.assign(a, { status: "working", task: stripRole(p.desc) || a.task || "Trabajando", tool: "empieza", startedAt: e.t - t0, bubble: null });
          if (p.model) a.model = p.model;
          if (isLeadRole(p.role)) L.leads[p.role.split(".")[0]] = true;
        }
      }
      else if (e.type === "tool") {
        const label = toolLabel(e.tool, e.target);
        const seat = seatOfEvent(e.agent, e.agent_type);
        if (seat) agent(seat).tool = label;
        else if (!e.agent) {
          pmTool = label;
          if (e.tool === "Skill") feed(e, "PM usa la skill " + String(e.target || "").replace(/^office:/, "") + ".");
        }
      }
      else if (e.type === "stop") {
        const seat = seatOfEvent(e.agent, e.agent_type);
        const p = byAgent[e.agent] || (seat ? { seat, role: roleFromType(e.agent_type) } : null);
        const n = tok(e.usage);
        L.claudeSub += n;
        if (p && p.seat) {
          const a = agent(p.seat), v = e.verdict || "LISTO", bad = FAILS.includes(v);
          a.tokens += n;
          a.tool = "";
          a.status = v === "APROBACION" ? "waiting" : bad ? "fail" : "pass";
          a.bubble = v === "APROBACION" ? "pide aprobación" : v === "FALLO" ? "FALLÓ" : v === "VALIDACION" ? "VALIDÓ" : v;
          a.bubbleUntil = e.t + 12;
          if (v === "FALLA") L.fails += 1;
          feed(e, a.label + " terminó: " + a.bubble + (n ? " · " + fmt(n) + " tokens" : "") + ".", bad ? "alert" : v === "APROBACION" ? "warn" : "good");
          const lead = p.lead || managedBy(p.role);
          if (lead) {
            // Modo equipos: el resultado se queda en el departamento.
            if (fresh) fx.push(() => {
              if (v === "FALLA" && /\.tester$/.test(p.role || "")) {
                const dev = seatFor(p.role.replace(/tester$/, "developer"));
                if (dev) { talkTo(p.seat, dev, ["FALLA: mirá esto", "Uh, lo corrijo"]); later(dev, 4.5, "scratch"); }
                else talkTo(p.seat, lead, ["FALLA", "Lo vemos"]);
              } else {
                if (!bad) pose(p.seat, "celebrate", 2);
                talkTo(p.seat, lead, [/\.tester$/.test(p.role || "") ? a.bubble + ": todo en verde" : "Listo, terminé", "¡Bien!"]);
              }
            });
          } else {
            // El PM va a buscar el reporte al departamento que terminó.
            goTo(p.seat);
            pmStatus = "working";
            pmTool = v === "APROBACION" ? "lee el pedido de aprobación" : "busca el reporte de " + room(a.room).name;
            if (fresh && !bad && v !== "APROBACION") fx.push(() => pose(p.seat, "celebrate", 2));
          }
        }
      }
      else if (e.type === "message") {
        const text = e.text || "";
        const toLead = leadByName(e.to);
        let fromSeat = seatOfEvent(e.from, e.from_type);
        if (!fromSeat && !toLead) { const act = Object.keys(L.leads); if (act.length === 1) fromSeat = leadSeat(act[0]); }
        if (fromSeat && isLeadRole(agent(fromSeat).role)) {
          const la = agent(fromSeat), approval = /aprobaci/i.test(text);
          Object.assign(la, { status: approval ? "waiting" : "pass", tool: "", bubble: approval ? "pide aprobación" : /report/i.test(text) ? "REPORTE" : "MENSAJE", bubbleUntil: e.t + 12 });
          goTo(fromSeat);
          pmStatus = "working";
          pmTool = approval ? "lee el pedido de aprobación" : "busca el reporte de " + room(la.room).name;
          feed(e, la.label + " al PM: " + (text || "mensaje") + ".", approval ? "warn" : "good");
          if (fresh) fx.push(() => la.acts.push({ k: "wait", d: 2 }, { k: "say", text: approval ? "Necesito tu OK" : "Acá está el reporte", d: 2.5 }));
        } else if (toLead) {
          const la = agent(toLead);
          Object.assign(la, { status: "working", tool: "lee el mensaje del PM", bubble: null });
          goTo(toLead);
          pmStatus = "working"; pmTool = "habla con " + la.label;
          feed(e, "PM a " + la.label + ": " + (text || "mensaje") + ".");
          if (fresh) fx.push(() => la.acts.push({ k: "wait", d: 2.5 }, { k: "say", text: "Recibido", d: 2 }));
        } else if (text) feed(e, "Mensaje: " + text + ".");
      }
      else if (e.type === "teammate_idle") {
        const seat = leadByName(e.name);
        if (seat) { const la = agent(seat); if (la.status === "working") { la.status = "idle"; la.tool = ""; } }
      }
      else if (e.type === "task") {
        feed(e, (e.state === "completed" ? "Tarea terminada" : "Tarea nueva") + ": " + (e.subject || "sin título") + (e.name ? " (" + e.name + ")" : "") + ".", e.state === "completed" ? "good" : "");
      }
      else if (e.type === "external") {
        const prov = e.provider, n = e.tokens || 0;
        if (prov in L.ext) L.ext[prov] += n;
        const seat = seatFor(e.role, prov);
        if (seat) { const a = agent(seat); a.tokens += n; a.ext += n; if (e.model) a.model = e.model; }
        feed(e, (PROVIDERS[prov] ? PROVIDERS[prov].name : prov) + " (" + e.role + "): " + (e.result || "terminó") + " en " + clock(e.duration || 0) + (n ? " · " + fmt(n) + " tokens" : "") + ".", e.code ? "alert" : "");
      }
      else if (e.type === "external_start") {
        const seat = seatFor(e.role, e.provider);
        if (seat) { const a = agent(seat); if (e.model) a.model = e.model; a.tool = "trabaja en " + (PROVIDERS[e.provider] ? PROVIDERS[e.provider].name : e.provider); }
      }
      else if (e.type === "notify") {
        pmStatus = "waiting";
        pmTool = /permis|permission/i.test(e.message || "") ? "te pide un permiso" : "esperando al CEO";
        feed(e, "Claude Code: " + (e.message || "espera al CEO") + ".", "warn");
      }
      else if (e.type === "turn_end") {
        L.pmTokens = tok(e.usage) || L.pmTokens;
        pmTarget = "door"; pmStatus = "waiting"; pmTool = "espera que el CEO lo llame";
        feed(e, "El PM le responde al CEO y espera afuera.");
      }
    });
    state.tokens = { claude: L.pmTokens + L.claudeSub, codex: L.ext.codex, gemini: L.ext.gemini };
    Object.assign(state.pm, { status: pmStatus, tool: pmTool, task: pmTask || "Coordina la oficina", tokens: L.pmTokens });
    if (!agent(state.selected) && state.selected !== "pm") state.selected = "pm";
    else if (state.selected !== "pm" && !agent(state.selected).present) state.selected = "pm";
    setPMTarget(pmTarget);
    // Quien recibe trabajo deja el café; después, las animaciones de lo nuevo.
    state.agents.forEach(a => { if (a.status === "working") cancelIdle(a); });
    fx.forEach(f => f());
    $("ticket").innerHTML = sess
      ? "<b>" + esc(sess.project || "proyecto") + "</b>" + (sess.ticket ? " · <b>" + esc(sess.ticket) + "</b>" : "") + (sess.branch ? " · " + esc(sess.branch) : "") + (teams ? " · modo equipos" : "")
      : "Sin sesión todavía";
  }

  // Los dos QA debaten cuando el PM pide la validación cruzada.
  function qaDebate() {
    const qs = ["qa1", "qa2"].map(agent).filter(a => a.present);
    if (qs.length >= 2 && !qs.some(a => a.acts.length && !a.idleTrip)) debate("qa1", "qa2", DEBATE_LINES);
  }

  function liveTick(dt) {
    const now = Date.now() / 1000;
    state.t = state.live ? now - state.live.t0 : 0;
    movePM(dt);
    state.agents.forEach(a => { if (a.bubble && now > a.bubbleUntil) { a.bubble = null; if (a.status === "pass") a.status = "idle"; } });
    animTick(dt);
  }

  function setMode(m) {
    mode = m;
    if (m === "live") {
      state.pmTarget = null;
      state.agents.forEach(clearAnim);
      state.holds = {}; state.nextIdle = 0;
      liveAnimFrom = liveEvents.length;
      liveRebuild();
    } else {
      ROOMS.forEach(r => { r.off = false; });
      state = freshState();
      startStep();
      for (let i = 0; i < 120; i++) update(0.1);
      $("ticket").innerHTML = "<b>PROJ-123</b> Pedidos con estado · <b>feature/PROJ-123-pedidos</b> → epic/PROJ-100-checkout";
    }
    updateModeUI();
    renderPanel(true);
  }

  function updateModeUI() {
    const live = mode === "live";
    const chip = $("mode-chip");
    chip.textContent = live ? "EN VIVO" : "DEMO";
    chip.classList.toggle("live", live);
    $("btn-live").setAttribute("aria-pressed", String(live));
    $("btn-demo").setAttribute("aria-pressed", String(!live));
    $("demo-controls").hidden = live;
    $("notice").hidden = live || (liveFile && liveCount > 0);
  }

  function poll() {
    const buf = [];
    window.OFFICE_EVENT = e => { if (e && typeof e === "object") buf.push(e); };
    const sc = document.createElement("script");
    sc.src = "events.js?t=" + Date.now();
    sc.onload = () => {
      sc.remove();
      liveFile = true;
      // Un archivo a medio escribir no tiene que borrar lo que ya se ve.
      if (buf.length === 0 && liveCount > 0) return;
      if (buf.length !== liveCount) {
        liveCount = buf.length;
        liveEvents = buf;
        if (mode === "live") liveRebuild();
        else if (!userPicked && buf.length) setMode("live");
      }
      updateModeUI();
    };
    sc.onerror = () => { sc.remove(); liveFile = false; updateModeUI(); };
    document.head.appendChild(sc);
  }

  // --- Panel -------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString("es-AR");
  const clock = t => String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(Math.floor(t % 60)).padStart(2, "0");
  const STATUS = { working: "TRABAJA", waiting: "ESPERA", pass: "LISTO", fail: "FALLA", idle: "LIBRE" };
  const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  function people() {
    const pm = state.pm;
    return [{ id: "pm", label: "PM", provider: "claude", model: "opus", tier: "opus", role: "pm", status: pm.status, tool: pm.tool, task: pm.task || "Coordina la oficina", tokens: pm.tokens, startedAt: 0, room: pm.room }]
      .concat(state.agents.filter(a => a.provider && a.present));
  }

  function renderPhases() {
    if (mode === "live") {
      const route = state.live ? state.live.route : [];
      $("phases").innerHTML = route.length
        ? route.slice(-9).map((n, i, arr) => `<span class="phase ${i === arr.length - 1 ? "now" : "done"}">${esc(n)}</span>`).join("")
        : `<span class="phase">Todavía no hay encargos en esta sesión</span>`;
      return;
    }
    $("phases").innerHTML = PHASES.map((p, i) => `<span class="phase ${i < state.phase ? "done" : i === state.phase ? "now" : ""}">${i + 1}. ${p}</span>`).join("");
  }

  function renderStats() {
    const t = state.tokens, total = t.claude + t.codex + t.gemini;
    const all = people();
    const active = all.filter(p => p.status === "working").length;
    const max = Math.max(1, t.claude, t.codex, t.gemini);
    const prov = k => `<div class="stat"><div class="k">${PROVIDERS[k].name}</div><div class="v">${fmt(t[k])}</div><div class="s">${total ? Math.round(t[k] / total * 100) : 0}% de los tokens</div><div class="bar"><i style="width:${(t[k] / max * 100).toFixed(1)}%;background:${PROVIDERS[k].color}"></i></div></div>`;
    $("stats").innerHTML = `
      <div class="stat"><div class="k">Tokens</div><div class="v">${fmt(total)}</div><div class="s">${mode === "live" ? "entrada, salida y caché escrita" : "en esta sesión"}</div></div>
      ${prov("claude")}${prov("codex")}${prov("gemini")}
      <div class="stat"><div class="k">Trabajando</div><div class="v">${active}</div><div class="s">de ${all.length} en la oficina</div></div>
      <div class="stat"><div class="k">Tiempo</div><div class="v">${clock(state.t)}</div><div class="s">${mode === "live" ? (state.live ? state.live.fails : 0) + " " + ((state.live && state.live.fails === 1) ? "falla" : "fallas") + " del tester" : (state.rounds + 1) + " " + (state.rounds ? "vueltas" : "vuelta") + " developer → tester"}</div></div>`;
  }

  function renderAgents() {
    const list = people().slice().sort((a, b) => (b.status === "working") - (a.status === "working") || b.tokens - a.tokens);
    $("agents").innerHTML = list.map(a => `
      <button type="button" class="agent ${state.selected === a.id ? "sel" : ""}" data-id="${a.id}">
        <i class="dot" style="background:${PROVIDERS[a.provider].color}"></i>
        <span class="who"><b>${esc(a.label)}</b><span>${PROVIDERS[a.provider].name} · ${esc(a.model)} · ${fmt(a.tokens)} tokens</span></span>
        <span class="pill ${a.status}">${STATUS[a.status] || "LIBRE"}</span>
      </button>`).join("");
  }

  const portrait = document.createElement("canvas");
  portrait.width = 56; portrait.height = 56;
  function drawPortrait(a, target) {
    const pg = portrait.getContext("2d");
    const saved = g;
    g = pg;
    const now = performance.now() / 1000;
    px(0, 0, 56, 56, "#232a38");
    px(0, 40, 56, 16, "#1b202b");
    if (a.id === "pm") {
      const lk = { skin: SKINS[0], hair: "#2a1c14", style: 0, glasses: false };
      drawTorso(28, 38, { role: "pm", id: "pm", provider: "claude" }, "purple");
      drawHead(20, 25, lk, { mood: a.status === "working" ? "focus" : "happy", blink: Math.floor(now * 2.2) % 19 === 0 });
    } else {
      const src = agent(a.id), lk = look(src.look);
      drawChair(28, 40);
      drawTorso(28, 38, src, src.color);
      drawHead(20, 25, lk, { mood: moodOf(src), blink: Math.floor(now * 2.2 + 3) % 17 === 0, glasses: (src.role || "").endsWith("architect") });
      drawAccessory(28, 25, src, now);
    }
    g = saved;
    const tc = target.getContext("2d");
    tc.imageSmoothingEnabled = false;
    tc.clearRect(0, 0, target.width, target.height);
    tc.drawImage(portrait, 10, 18, 36, 36, 0, 0, target.width, target.height);
  }

  function renderDetail() {
    const list = people();
    const a = list.find(p => p.id === state.selected) || list[0];
    const r = room(a.room);
    const elapsed = a.status === "working" && a.startedAt !== null ? clock(state.t - a.startedAt) : "—";
    const via = a.provider === "claude" ? "agente de Claude" : "por el puente office:external";
    $("detail").innerHTML = `
      <h2>Empleado</h2>
      <div class="head">
        <canvas id="portrait" width="224" height="224" aria-label="Retrato de ${a.label}"></canvas>
        <div>
          <div class="name"><i style="width:12px;height:12px;display:inline-block;background:${PROVIDERS[a.provider].color}"></i>${a.label}</div>
          <div class="quote">${a.status === "working" ? "“" + esc(a.tool || a.task) + "”" : a.status === "fail" ? "Encontré un problema." : a.status === "pass" ? "Listo." : a.status === "waiting" ? "Esperando al CEO." : "Disponible."}</div>
        </div>
      </div>
      <dl>
        <dt>Rol</dt><dd>${a.role}</dd>
        <dt>Proveedor</dt><dd>${PROVIDERS[a.provider].name}, ${via}</dd>
        <dt>Modelo</dt><dd>${esc(a.model)} · nivel ${a.tier} · razonamiento medio</dd>
        <dt>Oficina</dt><dd>${r ? r.name : "Pasillo"}</dd>
        <dt>Estado</dt><dd><span class="pill ${a.status}">${STATUS[a.status] || "LIBRE"}</span></dd>
        <dt>Tarea</dt><dd>${esc(a.task) || "—"}</dd>
        <dt>Ahora</dt><dd>${esc(a.tool) || "—"}</dd>
        <dt>Tiempo</dt><dd>${elapsed}</dd>
        <dt>Tokens</dt><dd>${fmt(a.tokens)}</dd>
      </dl>`;
    drawPortrait(a, $("portrait"));
  }

  function renderFeed() {
    $("feed").innerHTML = state.feed.slice(0, 40).map(e => `<li><time>${mode === "live" ? hourOf(e.at) : clock(e.t)}</time><span class="${e.kind}">${esc(e.text)}</span></li>`).join("");
  }

  let lastPanel = 0;
  function renderPanel(force) {
    if (!force && performance.now() - lastPanel < 250) return;
    lastPanel = performance.now();
    renderPhases(); renderStats(); renderAgents(); renderDetail(); renderFeed();
  }

  // --- Interacción -------------------------------------------------------------
  canvas.addEventListener("click", e => {
    const rect = canvas.getBoundingClientRect();
    const wx = (e.clientX - rect.left) / rect.width * W;
    const wy = (e.clientY - rect.top) / rect.height * H;
    let best = null, bestD = 28;
    const pmD = Math.hypot(state.pm.x - wx, state.pm.y - 22 - wy);
    if (pmD < bestD) { best = "pm"; bestD = pmD; }
    state.agents.forEach(a => { if (!a.provider || !a.present) return; const s = a.pos ? { x: a.pos.x, y: a.pos.y - 18 } : seatOf(a); const d = Math.hypot(s.x - wx, s.y - 4 - wy); if (d < bestD) { best = a.id; bestD = d; } });
    if (best) { state.selected = best; renderPanel(true); }
  });
  $("agents").addEventListener("click", e => { const b = e.target.closest(".agent"); if (b) { state.selected = b.dataset.id; renderPanel(true); } });

  let playing = true, speed = 2;
  $("btn-play").addEventListener("click", () => {
    playing = !playing;
    $("btn-play").textContent = playing ? "Pausa" : "Seguir";
    $("btn-play").setAttribute("aria-pressed", String(!playing));
  });
  document.querySelectorAll("[data-speed]").forEach(b => b.addEventListener("click", () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll("[data-speed]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  }));
  $("btn-restart").addEventListener("click", () => { state = freshState(); startStep(); renderPanel(true); });

  function resize() {
    const w = canvas.parentElement.clientWidth * (window.devicePixelRatio || 1);
    S = Math.max(1, Math.round(w / W));
    canvas.width = W * S; canvas.height = H * S;
  }
  new ResizeObserver(resize).observe(canvas.parentElement);
  resize();

  // --- Arranque ----------------------------------------------------------------
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  state = freshState();
  startStep();
  for (let i = 0; i < 120; i++) update(0.1); // la primera imagen ya muestra trabajo
  $("btn-live").addEventListener("click", () => { userPicked = true; setMode("live"); });
  $("btn-demo").addEventListener("click", () => { userPicked = true; setMode("demo"); });
  updateModeUI();
  renderPanel(true);
  poll();
  setInterval(poll, 1500);

  let last = performance.now();
  function frame(ts) {
    const dt = Math.min(0.1, (ts - last) / 1000);
    last = ts;
    if (mode === "live") update(dt);
    else if (playing) update(dt * speed);
    render(reduced ? Math.floor(ts / 600) : ts / 1000);
    renderPanel(false);
    requestAnimationFrame(frame);
  }
  if (document.fonts) document.fonts.ready.then(() => renderPanel(true));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
