# Valida el marketplace, cada plugin y los scripts en cada push y pull request.
name: Validar

on:
  push:
  pull_request:

jobs:
  validate:
    # macOS trae el bash 3.2 de siempre y rutas con enlaces (/var → /private/var): ahí se rompen
    # cosas que en Linux andan.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validar el marketplace
        run: claude plugin validate .

      - name: Validar cada plugin
        run: |
          for plugin in plugins/*/; do
            claude plugin validate "$plugin"
          done

      - name: Revisar la sintaxis de los scripts
        run: |
          for script in $(find plugins -name '*.sh'); do
            bash -n "$script"
          done

      - name: Probar el hook de protección
        run: bash tests/protect.test.sh

      - name: Probar la guardia de ramas
        run: bash tests/branch-guard.test.sh

      - name: Probar la revisión de la colección de API
        run: bash tests/api-collection.test.sh

      - name: Probar la configuración de proveedores
        run: bash tests/office-agents.test.sh

      - name: Probar el presupuesto de tokens
        run: bash tests/budget.test.sh

      - name: Probar la memoria del proyecto
        run: bash tests/decisions.test.sh

      - name: Probar el puente a Codex y Gemini
        run: bash tests/run-external.test.sh

      - name: Probar el hook del observer
        run: bash tests/observer.test.sh

      - name: Probar la oficina remota por Telegram
        run: bash tests/telegram.test.sh

      - name: Probar la actualización de la oficina
        run: bash tests/update-office.test.sh

      - name: Probar la revisión de consumo
        run: bash tests/save-tokens.test.sh

      - name: Probar el índice del proyecto
        run: bash tests/project-map.test.sh
